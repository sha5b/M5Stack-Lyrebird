<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- The parent project's mark: a syrinx, one stem dividing into two unequal
		     bronchi, which is the mechanism every note here is synthesized from. All of
		     these are its files, copied from Lyrebird/app/static/brand — the same mark on
		     the board's page as on the instrument's.

		     Order matters: a browser takes the last icon it understands, so the SVG comes
		     first and `alternate icon` carries the fallback for one that cannot read it. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="sitemap" type="application/xml" href="%sveltekit.assets%/sitemap.xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fafbfc" />
		<meta name="color-scheme" content="light" />
		<meta name="author" content="Shahab Nedaei" />
		<meta name="robots" content="index, follow, max-image-preview:large" />

		<!-- The parent project's pairing: Plex Sans for prose and controls, Plex Mono for
		     every figure, id and log line. Both fall back to the system stack. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
