<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-labelledby="lyrebird-mark-title lyrebird-mark-desc">
  <title id="lyrebird-mark-title">Lyrebird</title>
  <desc id="lyrebird-mark-desc">A bifurcating syrinx: one tracheal stem dividing into two
  unequal bronchi, each ending in a vibrating membrane.</desc>

  <!--
    The mark: a syrinx, flat. One stem, two branches, two membranes.

    **The subject is the sound source, not the bird.** A real bird's syrinx is bilateral — the
    trachea divides, and each side vibrates independently, which is why a bird can sing two
    notes at once. That division is the thing every note in this app is synthesized from: the
    two-parameter oscillator the whole instrument is built on. The mark draws the mechanism
    rather than the animal.

    **The reduction is already done at 512.** Three strokes and two dots, so there is no
    separate small variant and no need for one — see the raster table in README.md.

    **The Y, which is the one thing to know about this mark.** A stem dividing into two
    branches reads as the letter Y, and it does so at every size including 512. That was
    raised as a disqualifying defect when this was one of three candidates — the brief was a
    mark without type, and the old tail-and-curl mark had been rejected past 220 degrees for
    reading as a digit 6, which is the same failure — and the owner chose this one anyway
    (2026-08-06: "i like that icon use that please everywhere"). It is recorded here so the
    next person reads it as a decision rather than as an oversight.

    Three things push against the letter, and they are why the geometry is what it is:

    - **The branches are unequal.** Different lengths, different curvature, different tip
      sizes. A capital Y is symmetric; this is a bifurcation.
    - **The branches curve.** A Y is two straight diagonals. These are cubics that leave the
      stem tangentially, as a tube divides.
    - **The tips are membranes, not stroke ends.** Two filled circles of different radius,
      which no letterform has.

    **Not mirrored, and that is load-bearing.** Two arms bowing outward from one point make a
    heart — exactly, not approximately — which the previous mark's notes recorded after two
    attempts. The asymmetry here is what keeps that from happening as well.
  -->
  <circle cx="32" cy="32" r="32" fill="currentColor"/>

  <g fill="none" stroke="var(--paper, #fafbfc)" stroke-width="4.2" stroke-linecap="round">
    <!-- trachea -->
    <path d="M31 50 V37"/>
    <!-- the two bronchi, unequal in length and in curvature -->
    <path d="M31 37 C31 27 26 24 21 19"/>
    <path d="M31 37 C33 30 38 29 44 26"/>
  </g>
  <!-- the vibrating membranes, unequal, so the pair cannot read as symmetry -->
  <circle cx="20" cy="17" r="4.2" fill="var(--paper, #fafbfc)"/>
  <circle cx="46" cy="25" r="3.2" fill="var(--paper, #fafbfc)"/>
</svg>
