; Lyrebird — bird-chorus synth for the M5Stack Core family.
;
;   pio run -e m5stack-fire   -t upload
;   pio run -e m5stack-cores3 -t upload
;   pio device monitor
;
; The webflasher (web/) flashes the merged images produced by
; scripts/build-firmware.sh — one per board, because the Fire is an ESP32 and
; the CoreS3 an ESP32-S3. They are different architectures; there is no one
; binary that runs on both.
;
; Everything except the audio backend is shared. The Fire has an 8-bit DAC on
; GPIO25 and we drive it ourselves (src/audio_dac.cpp); the ESP32-S3 has no DAC
; at all, so the CoreS3 goes out over I2S to its AW88298 amplifier through
; M5Unified, which owns that chip's I2C bring-up (src/audio_spk.cpp).

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_build.partitions = partitions.csv
; -O2 over the framework default -Os: the syrinx inner loop is the whole CPU
; budget, and -Os declines to inline the biquad and the Euler step.
build_unflags = -Os
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2
; M5Unified covers the Fire, Core2 and CoreS3 from one API — including the
; AW88298/AW9523/AXP2101 bring-up on the CoreS3, and the bezel touch strip it
; presents as BtnA/B/C there, which is why the button code needs no board case.
lib_deps =
    m5stack/M5Unified@^0.2.19

; The band on the screen is one of two pictures, chosen by LYREBIRD_UI_GALAXY (see
; include/ui.h). Both boards draw the arms; the sweeping spectrogram is still there
; behind the flag, because it answers a question the arms do not — what pitch is
; sounding, right now, as a contour — and it is two columns of writes where the
; arms are a whole band.
;
; The arms cost 54 KB of flash for the layout, ~89 KB of DRAM for the off-screen
; canvas and 36 KB for the trails, and a full band over the LCD bus every frame.
; If the Fire ever crackles again, this flag is the first thing to try at 0: it is
; the only part of the picture that competes with the audio for the bus, and the
; Fire is the board living with an 8-bit DAC. galaxy.cpp has to leave
; build_src_filter along with the flag, or the board pays for a picture it never
; draws.
[env:m5stack-fire]
board = m5stack-fire
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_src_filter = +<*> -<audio_spk.cpp>
build_flags =
    ${env.build_flags}
    -DLYREBIRD_AUDIO_DAC=1
    -DLYREBIRD_UI_GALAXY=1

[env:m5stack-cores3]
board = m5stack-cores3
build_src_filter = +<*> -<audio_dac.cpp>
build_flags =
    ${env.build_flags}
    -DLYREBIRD_AUDIO_SPK=1
    -DLYREBIRD_UI_GALAXY=1
